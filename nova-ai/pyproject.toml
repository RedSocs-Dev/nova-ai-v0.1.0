[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai"
version = "0.1.0"
description = "Modular personal AI assistant starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1", "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["backend"]
