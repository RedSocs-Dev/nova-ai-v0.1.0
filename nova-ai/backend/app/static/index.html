<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>NOVA AI</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:light dark;--bg:#f5f6fa;--panel:#fff;--ink:#202336;--muted:#73778c;--line:#e4e6ef;--accent:#6257e8}
@media(prefers-color-scheme:dark){:root{--bg:#11131b;--panel:#1b1e2a;--ink:#f2f3fa;--muted:#a5a9bc;--line:#303447;--accent:#9b93ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 12px}button.primary{background:var(--accent);color:white;border-color:var(--accent)}.app{height:100dvh;display:grid;grid-template-columns:270px 1fr}.side{padding:18px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px;min-height:0}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px}.muted{color:var(--muted);font-size:13px}.history{overflow:auto;display:flex;flex-direction:column;gap:5px}.history button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history button.active{border-color:var(--accent)}.sidefoot{margin-top:auto;display:grid;gap:8px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--panel)}.thread{flex:1;overflow:auto;padding:28px max(20px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:20px}.welcome{margin:auto;text-align:center;max-width:550px}.welcome h1{font-size:36px;letter-spacing:-1.4px;margin-bottom:8px}.bubble{max-width:100%;padding:15px 18px;border:1px solid var(--line);border-radius:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:var(--panel);max-width:85%}.assistant{align-self:stretch;background:var(--panel)}.role{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}.composer-wrap{padding:12px 20px 20px;background:var(--bg)}.composer{max-width:850px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:flex-end}.composer textarea{flex:1;resize:vertical;min-height:44px;max-height:180px;border:0;outline:0;background:transparent;color:var(--ink);padding:10px}.status{max-width:850px;margin:7px auto 0;font-size:12px;color:var(--muted)}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.file{display:none}.error{color:#e05252}.source{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:700px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 14px}.thread{padding:18px 12px}.composer-wrap{padding:8px}.welcome h1{font-size:29px}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand">✦ NOVA AI</div><div class="muted">Votre assistant personnel</div><button class="primary" id="new">＋ Nouvelle conversation</button><div class="muted">HISTORIQUE</div><div class="history" id="history"></div><div class="sidefoot"><label class="muted">Ajouter un document <input class="file" id="upload" type="file" accept=".txt,.md,.csv,.json,.html"><button style="width:100%" onclick="document.querySelector('#upload').click()">＋ Importer un fichier</button></label><button id="settings">État du système</button><button id="clearMemory">Effacer la mémoire</button></div></aside>
<main class="main"><header class="top"><strong id="heading">Nouvelle conversation</strong><div class="tools"><span class="muted" id="model">Vérification…</span><button id="theme">☼</button></div></header><section class="thread" id="thread"><div class="welcome"><h1>Que souhaitez-vous explorer ?</h1><p class="muted">Posez une question, demandez une explication ou importez un document.</p></div></section><div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" placeholder="Écrivez votre message…" required maxlength="20000" rows="2"></textarea><button class="primary" id="send">Envoyer ↑</button></form><div class="status" id="status">Les réponses dépendent du modèle configuré. Vérifiez les informations importantes.</div></div></main></div>
<script>
let current=null, busy=false;
const $=s=>document.querySelector(s);
async function api(url,opts={}){let r=await fetch(url,{...opts,headers:{...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})}});let d=await r.json().catch(()=>({detail:r.statusText}));if(!r.ok)throw Error(d.detail||'Erreur réseau');return d}
function addBubble(role,text,sources=[]){let el=document.createElement('article');el.className='bubble '+role;let label=document.createElement('div');label.className='role';label.textContent=role==='user'?'VOUS':'NOVA';let body=document.createElement('div');body.textContent=text;el.append(label,body);if(sources.length){let s=document.createElement('div');s.className='source';s.textContent='Documents : '+sources.map(x=>x.filename).join(', ');el.append(s)}$('#thread').append(el);$('#thread').scrollTop=$('#thread').scrollHeight;return el}
async function loadHistory(){let rows=await api('/api/conversations');$('#history').replaceChildren();rows.forEach(c=>{let b=document.createElement('button');b.textContent=c.title;b.className=c.id===current?'active':'';b.onclick=()=>openConversation(c.id,c.title);b.oncontextmenu=async e=>{e.preventDefault();let t=prompt('Nouveau titre',c.title);if(t){await api('/api/conversations/'+c.id,{method:'PATCH',body:JSON.stringify({title:t})});loadHistory()}};$('#history').append(b)})}
async function openConversation(id,title){current=id;$('#heading').textContent=title;$('#thread').replaceChildren();let rows=await api('/api/conversations/'+id+'/messages');rows.forEach(m=>addBubble(m.role==='user'?'user':'assistant',m.content));await loadHistory()}
$('#new').onclick=async()=>{let c=await api('/api/conversations',{method:'POST'});current=c.id;$('#heading').textContent=c.title;$('#thread').replaceChildren();$('#thread').innerHTML='<div class="welcome"><h1>On commence ?</h1><p class="muted">Posez votre première question.</p></div>';loadHistory()};
$('#form').onsubmit=async e=>{e.preventDefault();if(busy)return;let message=$('#prompt').value.trim();if(!message)return;busy=true;$('#send').disabled=true;$('#status').textContent='NOVA réfléchit…';if(!current){let c=await api('/api/conversations',{method:'POST'});current=c.id}$('#thread').querySelector('.welcome')?.remove();addBubble('user',message);$('#prompt').value='';let pending=addBubble('assistant','Génération en cours…');try{let out=await api('/api/chat',{method:'POST',body:JSON.stringify({conversation_id:current,message})});pending.querySelector('div:nth-child(2)').textContent=out.message;let src=document.createElement('div');src.className='source';src.textContent=out.sources.length?'Sources documentaires : '+out.sources.map(x=>x.filename).join(', '):'';pending.append(src);$('#status').textContent='Modèle : '+out.provider+' / '+out.model;$('#heading').textContent=message.slice(0,48);await loadHistory()}catch(err){pending.querySelector('div:nth-child(2)').textContent='Erreur : '+err.message;pending.classList.add('error');$('#status').textContent='Vérifiez la configuration du modèle.'}finally{busy=false;$('#send').disabled=false;$('#prompt').focus()}};
$('#upload').onchange=async e=>{let f=e.target.files[0];if(!f)return;let form=new FormData();form.append('file',f);try{let r=await fetch('/api/documents',{method:'POST',body:form});let d=await r.json();if(!r.ok)throw Error(d.detail);$('#status').textContent=d.duplicate?'Document déjà importé.':'Document importé : '+d.filename}catch(err){$('#status').textContent='Import impossible : '+err.message}e.target.value=''};
$('#settings').onclick=async()=>{try{let [s,h]=await Promise.all([api('/api/settings'),api('/api/health')]);alert(JSON.stringify({configuration:s,état:h},null,2))}catch(e){alert(e.message)}};
$('#clearMemory').onclick=async()=>{if(confirm('Effacer tous les souvenirs enregistrés ?')){await api('/api/memory',{method:'DELETE'});$('#status').textContent='Mémoire effacée.'}};
$('#theme').onclick=()=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light'};
$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}};
(async()=>{try{let s=await api('/api/settings');$('#model').textContent=s.provider+' · '+s.model;await loadHistory()}catch(e){$('#status').textContent=e.message}})();
</script></body></html>
